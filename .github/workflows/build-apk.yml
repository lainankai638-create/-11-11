name: Build test APK
on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Test Python relay with mocked API responses
        run: python3 -m unittest discover -s server -v
      - name: Compile debug APK
        run: ./gradlew --no-daemon --stacktrace --max-workers=2 assembleDebug processReleaseManifest
      - name: Verify independent Debug APK and component isolation
        run: python3 scripts/verify_debug_isolation.py
      - uses: actions/upload-artifact@v4
        with:
          name: OunanSecondBrain-v0.5.3.1-independent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
